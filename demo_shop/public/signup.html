<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup — Shopper's Stop</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Shopper's Stop</h1>
    <nav>
      <a id="nav-home" href="/">Products</a>
      <a id="nav-cart" href="/cart.html">Cart</a>
      <a id="nav-signup" href="/signup.html">Signup</a>
    </nav>
  </header>
  <main>
    <p id="message" class="message" hidden></p>
    <h2>Signup</h2>
    <form id="signup-form">
      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="text" placeholder="you@example.com" />
      <button id="signup-submit" type="submit">Create account</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
